<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  kirin's fonts for the names sites and apps ask for by platform (CSS's
  system-ui and ui-*, macOS's and Windows' interface fonts): the same as
  sans-serif, serif and monospace. The NixOS module adds this file to
  fontconfig (fonts.fontconfig.localConf); elsewhere it goes into
  ~/.config/fontconfig/conf.d.
-->
<fontconfig>
  <!-- Interface text: Roboto -->
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>ui-sans-serif</family>
    <prefer><family>Roboto</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>-apple-system</family>
    <prefer><family>Roboto</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>BlinkMacSystemFont</family>
    <prefer><family>Roboto</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Roboto</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>SF Pro Text</family>
    <prefer><family>Roboto</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>
  <alias binding="same">
    <family>SF Pro Display</family>
    <prefer><family>Roboto</family></prefer>
    <default><family>sans-serif</family></default>
  </alias>

  <!-- Serif: Noto Serif -->
  <alias binding="same">
    <family>ui-serif</family>
    <prefer><family>Noto Serif</family></prefer>
    <default><family>serif</family></default>
  </alias>

  <!-- Code: JetBrains Mono -->
  <alias binding="same">
    <family>ui-monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
    <default><family>monospace</family></default>
  </alias>
  <alias binding="same">
    <family>SF Mono</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
    <default><family>monospace</family></default>
  </alias>
  <alias binding="same">
    <family>Menlo</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
    <default><family>monospace</family></default>
  </alias>
  <alias binding="same">
    <family>Consolas</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
    <default><family>monospace</family></default>
  </alias>
</fontconfig>
